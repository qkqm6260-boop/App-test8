

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sheriff Robot View</title>

<style>
    body {
        margin: 0;
        background: #101820;
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    h2 {
        color: #00e5ff;
    }

    #container {
        position: relative;
        width: min(95vw, 900px);
        margin: auto;
    }

    video, canvas {
        width: 100%;
        display: block;
        transform: scaleX(-1);
    }

    canvas {
        position: absolute;
        top: 0;
        left: 0;
    }

    #status {
        margin: 15px;
        font-size: 18px;
        color: #00ff88;
    }

    #coords {
        margin: 15px;
        font-size: 20px;
        color: #00e5ff;
    }

    button {
        padding: 12px 22px;
        font-size: 16px;
        cursor: pointer;
        background: #00bcd4;
        border: none;
        border-radius: 8px;
    }
</style>
</head>

<body>

<h2>SHERIFF ROBOT VIEW</h2>

<div id="container">
    <video id="video" autoplay muted playsinline></video>
    <canvas id="canvas"></canvas>
</div>

<div id="status">시작 버튼을 눌러 주세요.</div>
<div id="coords">X: -- | Y: -- | Z: --</div>

<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");
const coordsText = document.getElementById("coords");
const startButton = document.getElementById("start");

let running = false;

// 거리 추정 설정값
const FACE_WIDTH_CM = 16;
const FOCAL_LENGTH_PX = 600;
const WARN_RATIO = 0.35;

startButton.addEventListener("click", startCamera);

async function startCamera() {
    startButton.disabled = true;
    statusText.textContent = "얼굴 검출 모델을 불러오는 중...";

    try {
        const MODEL_URL =
            "https://cdn.jsdelivr.net/gh/vladmandic/face-api@latest/model/";

        await faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL);

        const stream = await navigator.mediaDevices.getUserMedia({
            video: true,
            audio: false
        });

        video.srcObject = stream;

        await new Promise(resolve => {
            video.onloadedmetadata = resolve;
        });

        await video.play();

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        running = true;
        statusText.textContent = "얼굴 추적 시작";
        detectFaces();

    } catch (error) {
        statusText.textContent =
            "오류: 카메라 권한 또는 인터넷 연결을 확인하세요.";
        console.error(error);
        startButton.disabled = false;
    }
}

async function detectFaces() {
    if (!running) return;

    if (video.readyState >= 2) {
        const result = await faceapi.detectAllFaces(
            video,
            new faceapi.TinyFaceDetectorOptions({
                inputSize: 320,
                scoreThreshold: 0.5
            })
        );

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const W = canvas.width;
        const H = canvas.height;
        const centerX = W / 2;
        const centerY = H / 2;

        // 화면 중심 십자선
        ctx.strokeStyle = "yellow";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(centerX - 20, centerY);
        ctx.lineTo(centerX + 20, centerY);
        ctx.moveTo(centerX, centerY - 20);
        ctx.lineTo(centerX, centerY + 20);
        ctx.stroke();

        if (result.length === 0) {
            statusText.textContent = "얼굴을 찾는 중...";
            coordsText.textContent = "X: -- | Y: -- | Z: --";
        }

        for (const face of result) {
            const { x, y, width, height } = face.box;

            const cx = x + width / 2;
            const cy = y + height / 2;

            // 얼굴 너비를 이용한 거리 추정
            const Z = FACE_WIDTH_CM * FOCAL_LENGTH_PX / width;

            // 화면 중심 기준 좌우/상하 좌표
            const X = (cx - centerX) * Z / FOCAL_LENGTH_PX;
            const Y = (centerY - cy) * Z / FOCAL_LENGTH_PX;

            const warning = width / W > WARN_RATIO;
            const color = warning ? "#ff3030" : "#00ff88";

            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, width, height);

            // 얼굴 중앙 십자선
            ctx.beginPath();
            ctx.moveTo(cx - 15, cy);
            ctx.lineTo(cx + 15, cy);
            ctx.moveTo(cx, cy - 15);
            ctx.lineTo(cx, cy + 15);
            ctx.stroke();

            // 얼굴 위에 상태 표시
            ctx.font = "bold 18px Arial";
            ctx.fillStyle = color;

            const label = warning
                ? "WARNING! TOO CLOSE!"
                : "TARGET LOCKED";

            ctx.fillText(label, x, Math.max(22, y - 8));

            coordsText.textContent =
                `X: ${X.toFixed(1)} cm | ` +
                `Y: ${Y.toFixed(1)} cm | ` +
                `Z: ${Z.toFixed(1)} cm`;

            statusText.textContent = warning
                ? "WARNING! 너무 가까움!"
                : "TARGET LOCKED - 얼굴 추적 중";
            statusText.style.color = color;
        }
    }

    requestAnimationFrame(detectFaces);
}
</script>

</body>
</html>
